name: collect

on:
  schedule:
    - cron: "7 * * * *"      # 매시 7분(UTC) 수집
    - cron: "53 22 * * *"    # 07:53 KST: 댓글 총수 수집 + 아침 요약 전송
  workflow_dispatch:
    inputs:
      backfill_comments:
        description: "댓글 월별 이력 다시 만들기(오래 걸림)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Collect
        run: |
          if [ "${{ github.event.schedule }}" = "53 22 * * *" ]; then
            python collector/collect.py --comments
          else
            python collector/collect.py
          fi

      - name: Backfill comment history
        if: ${{ inputs.backfill_comments }}
        run: python collector/backfill_comments.py

      - name: Build dashboard data
        run: python collector/build.py

      - name: Commit
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "data $(date -u +%FT%H:%MZ)"
          git push

      - name: Morning summary
        if: ${{ github.event.schedule == '53 22 * * *' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then python collector/summary.py --send; else python collector/summary.py; fi
